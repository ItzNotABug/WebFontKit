name: CI

on:
  push:
    branches: [main]
    paths-ignore: [README.md, LICENSE, .gitignore, "Example/**", "Sources/WebFontKit/WebFontKit.docc/**", scripts/build.sh, scripts/verify.sh]
  pull_request:
    paths-ignore: [README.md, LICENSE, .gitignore, "Example/**", "Sources/WebFontKit/WebFontKit.docc/**", scripts/build.sh, scripts/verify.sh]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in progress; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Must be an Xcode path listed for macos-26 in actions/runner-images.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

defaults:
  run:
    shell: bash

# No build cache: there are no dependencies, and a fresh checkout's timestamps
# make SwiftPM rebuild every file anyway. Simulators, UI tests and the
# many-runs loop stay in scripts/verify.sh; CI is the fast macOS check.
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - name: Test
            flags: ""
          # Builds and tests under Swift's upcoming concurrency default.
          - name: Concurrency
            flags: -Xswiftc -enable-upcoming-feature -Xswiftc NonisolatedNonsendingByDefault
    steps:
      - uses: actions/checkout@v7

      - name: No unsafeFlags in Package.swift
        run: "! sed 's#//.*##' Package.swift | grep -n unsafeFlags"

      # One SwiftPM invocation builds and tests; any warning fails it.
      - name: Build and test, zero warnings
        run: |
          source scripts/common.sh
          swiftpm_no_warnings test with_timeout 600 swift test --skip WebFontKitPerformanceTests \
            -Xswiftc -warnings-as-errors ${{ matrix.flags }}

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.name }}
          path: .build/logs
          include-hidden-files: true
          if-no-files-found: ignore
