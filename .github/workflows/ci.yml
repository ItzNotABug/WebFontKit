name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", LICENSE, .gitignore, "Example/**", "Sources/WebFontKit/WebFontKit.docc/**", scripts/build.sh, scripts/verify.sh, scripts/catalog.sh, scripts/catalog.py, scripts/reckon.sh, .github/workflows/reckon.yml]
  pull_request:
    paths-ignore: ["**/*.md", LICENSE, .gitignore, "Example/**", "Sources/WebFontKit/WebFontKit.docc/**", scripts/build.sh, scripts/verify.sh, scripts/catalog.sh, scripts/catalog.py, scripts/reckon.sh, .github/workflows/reckon.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - name: Test
            flags: ""
          - name: Concurrency
            flags: -Xswiftc -enable-upcoming-feature -Xswiftc NonisolatedNonsendingByDefault
    steps:
      - uses: actions/checkout@v7

      - name: No unsafeFlags in Package.swift
        run: |
          manifest=$(swift package dump-package)
          ! grep -q unsafeFlags <<< "$manifest"

      - name: Build and test, zero warnings
        run: |
          source scripts/common.sh
          swiftpm_no_warnings test with_timeout 600 swift test --skip WebFontKitPerformanceTests \
            -Xswiftc -warnings-as-errors ${{ matrix.flags }}

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.name }}
          path: .build/logs
          include-hidden-files: true
          if-no-files-found: ignore
