name: Reckon

on:
  schedule:
    - cron: "30 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: reckon

env:
  CATALOGUE: Sources/WebFontKit/Resources/GoogleFonts.catalog
  LISTING: Tests/Fixtures/catalog/shipped.tsv

jobs:
  reckon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Reckon
        id: reckon
        run: scripts/reckon.sh --summary "$RUNNER_TEMP/reckon.md"

      - name: Open or update the refresh PR
        if: steps.reckon.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr view catalog-refresh --json state -q .state 2>/dev/null || true)
          if [ "$open" = OPEN ] && git fetch -q origin catalog-refresh; then
            git show FETCH_HEAD:"$CATALOGUE" > "$RUNNER_TEMP/open.catalog"
            if cmp -s <(head -c 8 "$CATALOGUE"; tail -c +13 "$CATALOGUE") \
                      <(head -c 8 "$RUNNER_TEMP/open.catalog"; tail -c +13 "$RUNNER_TEMP/open.catalog"); then
              gh pr edit catalog-refresh --body-file "$RUNNER_TEMP/reckon.md"
              if [ "$(gh run list --workflow ci.yml --branch catalog-refresh --limit 1 --json conclusion -q '.[0].conclusion')" != success ]; then
                gh workflow run ci.yml --ref catalog-refresh
              fi
              exit 0
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C catalog-refresh
          git commit -qm "Refresh the Google Fonts catalogue" -- "$CATALOGUE" "$LISTING"
          git push -qf origin catalog-refresh
          if [ "$open" = OPEN ]; then
            gh pr edit catalog-refresh --body-file "$RUNNER_TEMP/reckon.md"
          else
            gh pr create --head catalog-refresh --base main --title "Refresh the Google Fonts catalogue" --body-file "$RUNNER_TEMP/reckon.md"
          fi
          gh workflow run ci.yml --ref catalog-refresh

      - name: Close a refresh PR main no longer needs
        if: steps.reckon.outputs.changed == 'false' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh pr view catalog-refresh --json state -q .state 2>/dev/null || true)" = OPEN ]; then
            gh pr close catalog-refresh --delete-branch --comment "main already matches Google's catalogue, so this refresh isn't needed."
          fi
