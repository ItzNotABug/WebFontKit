name: WebFontKitExample
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  WebFontKit:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_STYLE: Automatic
targets:
  ExampleApp:
    type: application
    platform: iOS
    configFiles: # the team and bundle ID prefix; Signing.xcconfig says how to set your own
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ExampleApp
      - path: ../Tests/Fixtures/Perf
        type: folder
        buildPhase: resources
    info:
      path: ExampleApp/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
    dependencies:
      - package: WebFontKit
        product: WebFontKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Example
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: WebFontKit
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  ExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ExampleUITests
    dependencies:
      - target: ExampleApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ExampleUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  # Runs the showcase as users get it: Release, for real performance on a device.
  Showcase:
    build:
      targets:
        ExampleApp: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Release
  ExampleApp:
    build:
      targets:
        ExampleApp: all
        ExampleUITests: [test]
    test:
      targets:
        - ExampleUITests
